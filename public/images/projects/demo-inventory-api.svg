<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" fill="none">
  <rect width="960" height="600" rx="20" fill="#080D1A"/>
  <rect x="1.5" y="1.5" width="957" height="597" rx="18.5" stroke="#1E293B" stroke-width="3"/>
  <rect x="36" y="34" width="888" height="532" rx="14" fill="#0D1426" stroke="#1E293B"/>
  <circle cx="66" cy="60" r="6" fill="#334155"/>
  <circle cx="88" cy="60" r="6" fill="#334155"/>
  <circle cx="110" cy="60" r="6" fill="#334155"/>
  <text x="148" y="64" fill="#94A3B8" font-family="monospace" font-size="13">REST API · SCHEMA &amp; ENDPOINT ARCHITECTURE</text>
  <rect x="736" y="49" width="166" height="22" rx="11" fill="#14B8A6" fill-opacity="0.14" stroke="#14B8A6" stroke-opacity="0.45"/>
  <text x="819" y="64" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="11">DEMO PREVIEW 02</text>
  <line x1="36" y1="86" x2="924" y2="86" stroke="#1E293B"/>
  <!-- Left endpoint list -->
  <rect x="58" y="112" width="380" height="430" rx="12" fill="#090F1E" stroke="#1E293B"/>
  <rect x="78" y="136" width="340" height="54" rx="8" fill="#121B33" stroke="#00E5FF" stroke-opacity="0.4"/>
  <rect x="92" y="151" width="54" height="24" rx="5" fill="#00E5FF" fill-opacity="0.2"/>
  <text x="119" y="167" text-anchor="middle" fill="#00E5FF" font-family="monospace" font-size="12">GET</text>
  <text x="162" y="167" fill="#E2E8F0" font-family="monospace" font-size="13">/api/v1/resources</text>
  <rect x="78" y="206" width="340" height="54" rx="8" fill="#121B33" stroke="#1E293B"/>
  <rect x="92" y="221" width="54" height="24" rx="5" fill="#14B8A6" fill-opacity="0.2"/>
  <text x="119" y="237" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="12">POST</text>
  <text x="162" y="237" fill="#CBD5E1" font-family="monospace" font-size="13">/api/v1/records</text>
  <rect x="78" y="276" width="340" height="54" rx="8" fill="#121B33" stroke="#1E293B"/>
  <rect x="92" y="291" width="54" height="24" rx="5" fill="#7C3AED" fill-opacity="0.25"/>
  <text x="119" y="307" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="12">PUT</text>
  <text x="162" y="307" fill="#CBD5E1" font-family="monospace" font-size="13">/api/v1/records/:id</text>
  <rect x="78" y="346" width="340" height="54" rx="8" fill="#121B33" stroke="#1E293B"/>
  <rect x="92" y="361" width="54" height="24" rx="5" fill="#F43F5E" fill-opacity="0.2"/>
  <text x="119" y="377" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="12">DEL</text>
  <text x="162" y="377" fill="#CBD5E1" font-family="monospace" font-size="13">/api/v1/records/:id</text>
  <!-- Database status box -->
  <rect x="78" y="424" width="340" height="96" rx="10" fill="#121B33" stroke="#1E293B"/>
  <text x="98" y="454" fill="#94A3B8" font-family="monospace" font-size="12">DATABASE LAYER</text>
  <text x="98" y="482" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="16">Relational Schema · Indexed Queries</text>
  <text x="98" y="504" fill="#14B8A6" font-family="monospace" font-size="12">MySQL / PostgreSQL · Input Validation</text>
  <!-- Right JSON payload block -->
  <rect x="462" y="112" width="440" height="430" rx="12" fill="#090F1E" stroke="#1E293B"/>
  <text x="488" y="146" fill="#64748B" font-family="monospace" font-size="13">// Sample JSON Response (200 OK)</text>
  <text x="488" y="186" fill="#A78BFA" font-family="monospace" font-size="15">{</text>
  <text x="512" y="218" fill="#00E5FF" font-family="monospace" font-size="15">"status": <tspan fill="#2DD4BF">"success"</tspan>,</text>
  <text x="512" y="250" fill="#00E5FF" font-family="monospace" font-size="15">"service": <tspan fill="#E2E8F0">"demo-backend-api"</tspan>,</text>
  <text x="512" y="282" fill="#00E5FF" font-family="monospace" font-size="15">"pagination": {</text>
  <text x="536" y="314" fill="#00E5FF" font-family="monospace" font-size="15">"page": <tspan fill="#FBBF24">1</tspan>,</text>
  <text x="536" y="346" fill="#00E5FF" font-family="monospace" font-size="15">"limit": <tspan fill="#FBBF24">20</tspan>,</text>
  <text x="536" y="378" fill="#00E5FF" font-family="monospace" font-size="15">"total": <tspan fill="#FBBF24">42</tspan></text>
  <text x="512" y="410" fill="#A78BFA" font-family="monospace" font-size="15">},</text>
  <text x="512" y="442" fill="#00E5FF" font-family="monospace" font-size="15">"validated": <tspan fill="#2DD4BF">true</tspan></text>
  <text x="488" y="474" fill="#A78BFA" font-family="monospace" font-size="15">}</text>
</svg>
